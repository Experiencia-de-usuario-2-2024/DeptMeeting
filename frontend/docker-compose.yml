networks:
  deptmeeting-network:

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-container
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - deptmeeting-network

  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - deptmeeting-network

  ms-users:
    container_name: deptmeeting-ms-users
    image: onicalls/deptmeeting-ms-users:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB_USERS=mongodb://mongodb:27017/deptmeeting_users
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network

  api-gateway:
    image: onicalls/deptmeeting-api-gateway:latest
    ports:
      - 3002:3002
      - 84:84
    environment:
      - APP_URL=https://deptmeeting.diinf.usach.cl
      - API_PORT=3002
      - PORT=3002
      - IO_PORT=84
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - PRIVATE_KEY_PATH=/etc/letsencrypt/live/deptmeeting.diinf.usach.cl/privkey.pem
      - CERTIFICATE_PATH=/etc/letsencrypt/live/deptmeeting.diinf.usach.cl/fullchain.pem
    networks:
      - deptmeeting-network
    depends_on:
      - rabbitmq

  ms-projects:
    container_name: deptmeeting-ms-projects
    image: onicalls/deptmeeting-ms-projects:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB_PROJECTS=mongodb://mongodb:27017/deptmeeting_projects
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network

  ms-meetings:
    container_name: deptmeeting-ms-meetings
    image: onicalls/deptmeeting-ms-meetings:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB_MEETINGS=mongodb://mongodb:27017/deptmeeting_meetings
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network

  ms-notifications:
    container_name: deptmeeting-ms-notifications
    image: onicalls/deptmeeting-ms-notifications:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB=mongodb://mongodb:27017/deptmeeting_notifications
      - IO_PORT=84
      - EMAIL_USER=jairosantiespino@gmail.com
      - EMAIL_PASS="farp asej fhsw dwni"
      - EMAIL_SERVICE=gmail
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=8000
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network


  ms-elements:
    container_name: deptmeeting-ms-elements
    image: onicalls/deptmeeting-ms-elements:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB_ELEMENTS=mongodb://mongodb:27017/deptmeeting_elements
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network

  ms-meetingminutes:
    container_name: deptmeeting-ms-meetingminutes
    image: onicalls/deptmeeting-ms-meetingminutes:latest
    environment:
      - JWT_SECRET=clavesecreta2312
      - EXPIRES_IN=12h
      - AMQP_URL=amqp://user:password@rabbitmq:5672
      - URI_MONGODB_MEETINGMINUTES=mongodb://mongodb:27017/deptmeeting_meetingminutes
    depends_on:
      - rabbitmq
    networks:
      - deptmeeting-network

  front-principal:
    image: onicalls/deptmeeting-frontend-principal:latest
    container_name: deptmeeting-frontend-principal
    ports:
      - 3003:3003
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_MF_URL=https://deptmeeting.diinf.usach.cl
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_PRINCIPAL_PORT=3003
      - REACT_APP_MF_HOME=/mf_home
      - REACT_APP_MF_LOGIN=/mf_login
      - REACT_APP_MF_PROYECTOS=/mf_proyectos
      - REACT_APP_MF_PERFIL=/mf_perfil
      - REACT_APP_MF_DESARROLLOREUNION=/mf_desarrolloreunion
      - REACT_APP_MF_INFORMACION=/mf_informacion
      - REACT_APP_MF_TAREAS=/mf_tareas
      - REACT_APP_MF_KANBANPLUS=/mf_kanbanplus
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

  mf-home:
    image: onicalls/deptmeeting-mf-home:latest
    container_name: deptmeeting-mf-home
    ports:
      - 3020:3020
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_HOME_PORT=3020
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

  mf-informacion:
    image: onicalls/deptmeeting-mf-informacion:latest
    container_name: deptmeeting-mf-informacion
    ports:
      - 3025:3025
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_INFORMACION_PORT=3025

  mf-login:
    image: onicalls/deptmeeting-mf-login:latest
    container_name: deptmeeting-mf-login
    ports:
      - 3021:3021
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_LOGIN_PORT=3021
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway
      - REACT_APP_GOOGLE_CLIENT_ID=463721565707-n85gsgtqtggm16pp87884uslc0p56t6d.apps.googleusercontent.com

  mf-perfil:
    image: onicalls/deptmeeting-mf-perfil:latest
    container_name: deptmeeting-mf-perfil
    ports:
      - 3023:3023
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_PERFIL_PORT=3023
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

  mf-proyectos:
    image: onicalls/deptmeeting-mf-proyectos:latest
    container_name: deptmeeting-mf-proyectos
    ports:
      - 3022:3022
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_PROYECTOS_PORT=3022
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

  mf-desarrolloreunion:
    image: onicalls/deptmeeting-mf-desarrolloreunion:latest
    container_name: deptmeeting-mf-desarrolloreunion
    ports:
      - 3024:3024
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_DESARROLLOREUNION_PORT=3024
      - REACT_APP_BACKEND_GATEWAY=https://deptmeeting.diinf.usach.cl/gateway
      - REACT_APP_BACKEND_IO=http://deptmeeting.diinf.usach.cl:84

  mf-kanbanplus:
    image: onicalls/deptmeeting-mf-kanbanplus:latest
    container_name: deptmeeting-mf-kanbanplus
    ports:
      - 3027:3027
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_KANBANPLUS_PORT=3027
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

  mf-tareas:
    image: onicalls/deptmeeting-mf-tareas:latest
    container_name: deptmeeting-mf-tareas
    ports:
      - 3026:3026
    restart: always
    depends_on:
      - api-gateway
    networks:
      - deptmeeting-network
    environment:
      - REACT_APP_ALLOWED_HOSTS=deptmeeting.diinf.usach.cl
      - REACT_APP_MF_TAREAS_PORT=3026
      - REACT_APP_BACKEND_URL=https://deptmeeting.diinf.usach.cl/gateway

volumes:
  mongodb_data:
    driver: local
